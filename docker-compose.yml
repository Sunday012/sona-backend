services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sona
      POSTGRES_PASSWORD: sona
      POSTGRES_DB: sona
    ports: ['5438:5432']
    volumes: [sona-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sona']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports: ['6380:6379']
    volumes: [sona-redis:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1026:1025', '8026:8025']
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: sona
      MINIO_ROOT_PASSWORD: sona-local-storage
    ports: ['9100:9000', '9101:9001']
    volumes: [sona-minio:/data]
volumes:
  sona-postgres:
  sona-redis:
  sona-minio:
